<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Little Museum</title>
<style>
:root{--bg:#1a1410;--fg:#f3e6c8;--gold:#c9a24b;--panel:rgba(26,20,16,.86);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1410;--fg:#f3e6c8}}
:root[data-theme="dark"]{--bg:#1a1410;--fg:#f3e6c8}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:Georgia,"Times New Roman",serif;overflow:hidden;touch-action:none}
canvas{display:block}
#hud{position:fixed;left:0;top:env(safe-area-inset-top,0px);padding:10px 14px;pointer-events:none;font-size:13px;text-shadow:0 1px 3px #000;z-index:2}
#hud b{color:var(--gold)}
#prompt{position:fixed;bottom:24%;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--gold);padding:8px 16px;border-radius:20px;display:none;font-size:14px;z-index:2}
#toast{position:fixed;top:25%;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--gold);padding:8px 18px;border-radius:20px;display:none;z-index:6;text-align:center;max-width:80vw}
button{background:var(--gold);color:#1a1410;border:0;padding:12px 28px;font:inherit;border-radius:24px;cursor:pointer;margin-top:14px}
#start{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:8}
#start h1{color:var(--gold);font-weight:normal;letter-spacing:.2em;font-size:clamp(26px,6vw,52px);margin:0 0 8px}
#start p{max-width:480px;line-height:1.5;opacity:.85}
#viewer,#req,#msg{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:7}
.card{background:var(--panel);border:3px solid var(--gold);padding:18px;max-width:88vw;text-align:center}
.card h2{color:var(--gold);font-weight:normal;margin:0 0 8px}
.card button{margin:10px 6px 0}
button.alt{background:transparent;color:var(--fg);border:1px solid var(--gold)}
#viewer canvas{max-width:80vw;max-height:55vh}
#joy{position:fixed;left:24px;bottom:calc(24px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;border:2px solid var(--gold);opacity:.6;display:none;z-index:3}
#joy i{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:var(--gold)}
#music-wrap{position:fixed;right:10px;top:calc(8px + env(safe-area-inset-top,0px));display:flex;gap:6px;align-items:center;z-index:3}
#bar{position:fixed;right:10px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;z-index:3}
#music-wrap button,#bar button{margin:0;padding:8px 12px;font-size:13px;background:var(--panel);color:var(--fg);border:1px solid var(--gold)}
#music-wrap input{width:70px}
#chat{position:fixed;left:10px;bottom:calc(160px + env(safe-area-inset-bottom,0px));width:min(320px,72vw);display:none;flex-direction:column;background:var(--panel);border:1px solid var(--gold);border-radius:12px;z-index:5;padding:8px}
#log{height:170px;overflow-y:auto;font-size:14px;line-height:1.4;display:flex;flex-direction:column;gap:4px}
#log div{padding:4px 8px;border-radius:10px;max-width:85%;word-wrap:break-word}
#log .me{align-self:flex-end;background:var(--gold);color:#1a1410}
#log .them{align-self:flex-start;background:rgba(243,230,200,.16)}
#chat .row{display:flex;gap:6px;margin-top:6px}
#chat input{flex:1;min-width:0;background:rgba(0,0,0,.35);color:var(--fg);border:1px solid var(--gold);border-radius:16px;padding:8px 12px;font:inherit;font-size:16px}
#chat button{margin:0;padding:8px 14px}
</style>
</head>
<body>
<div id="hud"><b>OUR LITTLE MUSEUM</b><br><span id="who">Connecting…</span><br><span id="help">WASD / arrows to walk · drag to look · click a frame</span></div>
<div id="prompt"></div><div id="toast"></div>
<div id="music-wrap"><button id="music">♪ Music</button><input type="range" id="vol" min="0" max="1" step=".05" value=".85" aria-label="Volume"></div>
<div id="bar"><button data-act="wave">👋 Wave</button><button data-act="hug">🤗 Hug</button><button data-act="kiss">💋 Kiss</button><button data-act="hand">🤝 Hold hands</button><button data-act="dance">💃 Dance</button><button data-act="propose">💍 Propose</button><button id="chatbtn">💬 Chat</button><button id="switch">🔄 Switch character</button></div>
<div id="chat"><div id="log"></div><div class="row"><input id="ci" maxlength="200" placeholder="Type a message…" autocomplete="off"><button id="cs">Send</button></div></div>
<div id="joy"><i></i></div>
<div id="viewer"><div class="card"><canvas id="vc" width="450" height="600"></canvas><h3 id="vt"></h3><p id="vd"></p><button id="vx">Close</button></div></div>
<div id="req"><div class="card"><h2 id="reqt"></h2><button id="acc">Accept ♥</button><button id="dec" class="alt">Decline</button></div></div>
<div id="msg"><div class="card"><h2>Will you marry me?</h2><p>Replace this message with your own words.</p><button id="yes">Yes ♥</button></div></div>

 ring.position.set(0,-.66,.05);ring.visible=false;arms[1].add(ring);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.26,24,24),M(o.skin));head.position.y=1.9;head.castShadow=true;g.add(head);
 const hair=new THREE.Mesh(new THREE.SphereGeometry(.285,24,24,0,Math.PI*2,0,Math.PI*.62),M(o.hair));hair.position.set(0,1.95,-.02);g.add(hair);
 if(o.long){const lh=new THREE.Mesh(new THREE.BoxGeometry(.56,.95,.14),M(o.hair));lh.position.set(0,1.5,-.2);g.add(lh)}
 else{const q=new THREE.Mesh(new THREE.SphereGeometry(.14,12,12),M(o.hair));q.position.set(0,2.2,.08);g.add(q)}
 for(const s of[-1,1]){const e=new THREE.Mesh(new THREE.SphereGeometry(.03),M(0x111111));e.position.set(s*.09,1.92,.24);g.add(e)}
 if(o.glasses)for(const s of[-1,1]){const r=new THREE.Mesh(new THREE.TorusGeometry(.065,.01,8,16),M(0x111111));r.position.set(s*.09,1.92,.255);g.add(r)}
 if(o.necklace){const n=new THREE.Mesh(new THREE.TorusGeometry(.14,.008,6,24),goldMat);n.rotation.x=Math.PI/2;n.position.set(0,1.62,.02);g.add(n)}
 const tag=textSprite(o.name,64,'#ffd98a');tag.position.y=2.65;g.add(tag);
 g.userData={legs,arms,ring};g.visible=false;scene.add(g);return g}
const chars={
 sharvin:makeChar({name:'SHARVIN',skin:0xc28a62,top:0xf5ecd7,bottom:0x1b1b1b,shoe:0x0a0a0a,hair:0x1a1210,glasses:true}),
 sarvinah:makeChar({name:'SARVINAH',skin:0xd9a27a,top:0xf4c6cf,bottom:0xf4c6cf,shoe:0xe8b4be,hair:0x2a1a14,long:true,dress:true,necklace:true})};
let me='sharvin';const opp=r=>r==='sharvin'?'sarvinah':'sharvin';
const mine=()=>chars[me],theirs=()=>chars[opp(me)];
chars.sharvin.position.set(-1,0,5);chars.sarvinah.position.set(1,0,5);mine().visible=true;

function pose(c,name,mv,t,other){const{legs,arms,ring}=c.userData;arms.forEach(a=>a.rotation.set(0,0,0));legs.forEach(l=>l.rotation.set(0,0,0));let y=0;
 const walk=m=>{const a=Math.sin(t*9)*.7*m;legs[0].rotation.x=a;legs[1].rotation.x=-a;arms[0].rotation.x=-a*.8;arms[1].rotation.x=a*.8;y=Math.abs(Math.sin(t*9))*.04*m};
 ring.visible=name==='kneel';
 if(name==='wave')arms[1].rotation.set(-2.6,0,Math.sin(t*10)*.4);
 else if(name==='hug')arms.forEach((a,i)=>a.rotation.set(-1.2,0,i?-.45:.45));
 else if(name==='dance'){arms.forEach((a,i)=>a.rotation.set(-1.1,0,i?-.3:.3));y=Math.abs(Math.sin(t*4))*.06}
 else if(name==='kneel'){legs[0].rotation.x=-1.4;legs[1].rotation.x=.5;arms[1].rotation.x=-1.5;y=-.42}
 else if(name==='cover')arms.forEach((a,i)=>a.rotation.set(-2.3,0,i?-.5:.5));
 else if(name==='hand'){walk(.6);if(other){const dx=other.x-c.position.x,dz=other.z-c.position.z,lx=dx*Math.cos(c.rotation.y)-dz*Math.sin(c.rotation.y),i=lx>0?1:0;arms[i].rotation.z=i?-.5:.5}}
 else if(name==='walk')walk(Math.max(.3,mv));
 else y=Math.sin(t*1.6)*.01;
 c.position.y=y}

// hearts + toast
const heartMat=new THREE.SpriteMaterial({map:canvasTex(64,64,g=>{g.font='52px serif';g.textAlign='center';g.textBaseline='middle';g.fillStyle='#e0587c';g.fillText('♥',32,34)}),transparent:true,depthWrite:false});
const hearts=[];
function heart(p,v,life){const s=new THREE.Sprite(heartMat);s.position.copy(p);s.scale.setScalar(.3);s.userData={v,life};scene.add(s);hearts.push(s)}
function burst(p,n){for(let i=0;i<n;i++)heart(p,new THREE.Vector3((Math.random()-.5)*1.4,.8+Math.random(),(Math.random()-.5)*1.4),2.5)}
function fall(c,n){for(let i=0;i<n;i++)heart(new THREE.Vector3(c.x+(Math.random()-.5)*4,5.5,c.z+(Math.random()-.5)*4),new THREE.Vector3(0,-1.6,0),4)}
function tickHearts(dt){for(let i=hearts.length-1;i>=0;i--){const s=hearts[i];s.position.addScaledVector(s.userData.v,dt);s.userData.life-=dt;s.scale.setScalar(.3*Math.max(.01,Math.min(1,s.userData.life)));if(s.userData.life<=0){scene.remove(s);hearts.splice(i,1)}}}
const toast=$('toast');function say(t,ms){toast.textContent=t;toast.style.display='block';clearTimeout(say.h);if(ms)say.h=setTimeout(()=>toast.style.display='none',ms)}
function hideSay(){toast.style.display='none'}

// music (loops forever)
const song=new Audio(SONG_URL);song.loop=true;song.preload='auto';let vol=.85,wantMusic=true;song.volume=vol;
const musicBtn=$('music');const refreshMusic=()=>{musicBtn.textContent=song.paused?'♪ Music off':'♪ Music on'};
song.addEventListener('play',refreshMusic);song.addEventListener('pause',refreshMusic);
song.addEventListener('ended',()=>{song.currentTime=0;song.play().catch(()=>{})});
song.addEventListener('pause',()=>{setTimeout(()=>{if(wantMusic&&song.paused&&!document.hidden)song.play().catch(()=>{})},500)});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&wantMusic&&started)song.play().catch(()=>{})});
musicBtn.onclick=()=>{if(song.paused){wantMusic=true;song.play().catch(()=>{})}else{wantMusic=false;song.pause()}};
$('vol').oninput=e=>{vol=+e.target.value};

// input
const keys={};addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;keys[e.code]=true});addEventListener('keyup',e=>keys[e.code]=false);
let yaw=0,pitch=.35,joy={x:0,y:0},drag=null,moved=0,started=false;
const el=renderer.domElement;
el.addEventListener('pointerdown',e=>{drag={id:e.pointerId,x:e.clientX,y:e.clientY};moved=0});
addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);yaw-=dx*.005;pitch=Math.max(.05,Math.min(1.1,pitch+dy*.004))});
addEventListener('pointerup',e=>{if(drag&&e.pointerId===drag.id){if(moved<6&&e.target===el)pick(e);drag=null}});
const ray=new THREE.Raycaster(),mv2=new THREE.Vector2(),viewer=$('viewer');
function pick(e){mv2.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(mv2,cam);const h=ray.intersectObjects(frames.concat([screen]))[0];if(!h)return;
 if(h.object===screen){toggleVideo();return}if(h.distance<9)openViewer(h.object.userData)}
function openViewer(d){$('vt').textContent=d.title;$('vd').textContent=d.date+' · '+d.caption;const c=$('vc').getContext('2d');c.clearRect(0,0,450,600);c.drawImage(d.img,0,0,450,600);viewer.style.display='flex'}
$('vx').onclick=()=>viewer.style.display='none';
const joyEl=$('joy'),knob=joyEl.firstElementChild;
if(matchMedia('(pointer:coarse)').matches){joyEl.style.display='block';$('help').textContent='Joystick to walk · drag to look · tap a frame'}
let jid=null;function jmove(e){const r=joyEl.getBoundingClientRect();let x=(e.clientX-r.left-60)/50,y=(e.clientY-r.top-60)/50;const m=Math.hypot(x,y);if(m>1){x/=m;y/=m}joy={x,y};knob.style.transform=`translate(${x*40}px,${y*40}px)`}
joyEl.addEventListener('pointerdown',e=>{e.stopPropagation();jid=e.pointerId;joyEl.setPointerCapture(jid);jmove(e)});
joyEl.addEventListener('pointermove',e=>{if(e.pointerId===jid)jmove(e)});
const jend=()=>{jid=null;joy={x:0,y:0};knob.style.transform=''};joyEl.addEventListener('pointerup',jend);joyEl.addEventListener('pointercancel',jend);
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});
$('go').onclick=()=>{started=true;$('start').style.display='none';song.play().catch(()=>{});
 vid.muted=false;const pr=vid.play();if(pr)pr.then(()=>{vid.pause();vid.currentTime=0}).catch(()=>{})};

// ---------- multiplayer (room presence) ----------
let room=null,partner=null,myPeer=null,lastSent=0,lastKey='',handled=0,incoming=null,myReq=null,act=null,curPose='idle',curMv=0,facing=Math.PI;
const num=(v,d)=>Math.round(v*Math.pow(10,d||2))/Math.pow(10,d||2);
const VERB={wave:'wave at you',hug:'hug you',kiss:'kiss you',hand:'hold your hand',dance:'dance with you',propose:'ask you something special 💍'};
function updateStatus(){$('who').textContent='You are '+NAMES[me].toUpperCase()+(room?(partner?' · ● '+NAMES[opp(me)]+' is here':' · ○ waiting for '+NAMES[opp(me)]):' · offline (open the shared link while signed in)')}
function setRole(r){const old=mine();me=r;const n=mine();n.position.copy(old.position);n.rotation.y=old.rotation.y;n.visible=true;old.visible=false;old.userData.init=false;theirs().visible=!!partner;updateStatus();sendPresence(true)}
function sendPresence(force){if(!room)return;const c=mine(),now=performance.now();
 const f={role:me,x:num(c.position.x),z:num(c.position.z),ry:num(c.rotation.y),mv:num(curMv,1),pose:curPose,vt:isPlaying()?Math.round(vid.currentTime):null};
 const key=JSON.stringify(f);if(!force&&(key===lastKey&&now-lastSent<1000||now-lastSent<70))return;lastKey=key;lastSent=now;room.presence(f).catch(()=>{})}
function onPeers(ch){const ps=ch.peers,mp=ps.find(p=>p.sameTab);if(mp)myPeer=mp.peer;
 partner=ps.filter(p=>!p.isMe&&p.kind==='viewer').sort((a,b)=>a.peer<b.peer?-1:1)[0]||null;
 if(partner&&partner.presence.role===me&&myPeer&&partner.peer<myPeer)setRole(opp(me));
 theirs().visible=!!partner;
 if(!partner){if(act)endAct();myReq=null;incoming=null;$('req').style.display='none'}
 updateStatus();signals()}
function signals(){if(!partner)return;const pr=partner.presence;chatIn(pr);
 if(pr.req&&pr.req.id!==handled&&!act&&!incoming){incoming=pr.req;$('reqt').textContent=NAMES[opp(me)]+' wants to '+(VERB[pr.req.type]||'do something with you');$('req').style.display='flex'}
 if(incoming&&(!pr.req||pr.req.id!==incoming.id)){incoming=null;$('req').style.display='none'}
 if(myReq&&pr.ans&&pr.ans.id===myReq.id){const a=pr.ans,r=myReq;myReq=null;room.presence({req:null}).catch(()=>{});hideSay();if(a.ok)startAct(r.type,'req',a,r.id);else say(NAMES[opp(me)]+' declined',2500)}
 if(act&&act.type==='propose'&&!act.said&&pr.yes===act.id)gotYes()}
$('acc').onclick=()=>{if(!incoming||!partner)return;const r=incoming;incoming=null;handled=r.id;$('req').style.display='none';
 const p=mine().position,q=partner.presence;let dx=(q.x||0)-p.x,dz=(q.z||0)-p.z;const L=Math.hypot(dx,dz);if(L<.1){dx=0;dz=1}else{dx/=L;dz/=L}
 const a={id:r.id,ok:1,cx:num(p.x),cz:num(p.z),dx:num(dx),dz:num(dz)};room.presence({ans:a}).catch(()=>{});startAct(r.type,'acc',a,r.id)};
$('dec').onclick=()=>{if(!incoming)return;handled=incoming.id;room.presence({ans:{id:incoming.id,ok:0}}).catch(()=>{});incoming=null;$('req').style.display='none'};
document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{if(!started||act||myReq)return;
 if(!partner){say('Waiting for your partner to join…',2500);return}
 const id=Math.floor(Math.random()*1e9)+1;myReq={id,type:b.dataset.act,t0:performance.now()};room.presence({req:{id,type:b.dataset.act},ans:null,yes:null}).catch(()=>{});say('Waiting for '+NAMES[opp(me)]+' to accept…')});
$('switch').onclick=()=>{if(partner&&partner.presence.role===opp(me)){say(NAMES[opp(me)]+' is already taken by your partner',2500);return}setRole(opp(me))};

// ---------- chat (travels through presence; not saved) ----------
let chatOpen=false,unread=0,lastChat=0,chatPeer=null;
function addMsg(who,text,mineMsg){const d=document.createElement('div');d.className=mineMsg?'me':'them';d.textContent=(mineMsg?'':who+': ')+text;const log=$('log');log.appendChild(d);while(log.children.length>60)log.removeChild(log.firstChild);log.scrollTop=log.scrollHeight}
function chatLabel(){$('chatbtn').textContent=unread?'💬 Chat ('+unread+')':'💬 Chat'}
function chatIn(pr){if(partner.peer!==chatPeer){chatPeer=partner.peer;lastChat=pr.chat?pr.chat.id:0;return}
 const ch=pr.chat;if(!ch||ch.id===lastChat||typeof ch.t!=='string')return;lastChat=ch.id;const txt=ch.t.slice(0,200);addMsg(NAMES[opp(me)],txt,false);
 if(!chatOpen){unread++;chatLabel();say(NAMES[opp(me)]+': '+txt,3500)}}
function sendChat(){const i=$('ci'),txt=i.value.trim();if(!txt)return;
 if(!room||!partner){say('Your partner is not in the museum yet',2500);return}
 room.presence({chat:{id:Date.now()*10+Math.floor(Math.random()*10),t:txt.slice(0,200)}}).catch(()=>{});addMsg('',txt,true);i.value=''}
$('chatbtn').onclick=()=>{chatOpen=!chatOpen;$('chat').style.display=chatOpen?'flex':'none';if(chatOpen){unread=0;chatLabel();$('log').scrollTop=$('log').scrollHeight;$('ci').focus()}};
$('cs').onclick=sendChat;$('ci').addEventListener('keydown',e=>{if(e.key==='Enter')sendChat()});

// ---------- interactions ----------
const clampX=x=>Math.max(-5,Math.min(5,x)),clampZ=z=>Math.max(-28,Math.min(6.8,z));
function startAct(type,role,a,id){act={type,role,id,t:0,cx:a.cx,cz:a.cz,dx:a.dx,dz:a.dz,said:false,end:0,hb:0};
 if(type==='propose'&&role==='req')say('Waiting for '+NAMES[opp(me)]+'’s answer…')}
function endAct(){act=null;curPose='idle';curMv=0;facing=mine().rotation.y;$('msg').style.display='none';hideSay();if(room)room.presence({yes:null}).catch(()=>{});sendPresence(true)}
function gotYes(){if(!act||act.said)return;act.said=true;act.end=act.t+4;$('msg').style.display='none';burst(new THREE.Vector3(mine().position.x,2.4,mine().position.z),60);say('She said yes ♥',4000)}
$('yes').onclick=()=>{if(!act)return;room.presence({yes:act.id}).catch(()=>{});gotYes()};
function actStep(dt){const a=act,c=mine(),p=c.position,pr=partner?partner.presence:null;a.t+=dt;const T=a.t,req=a.role==='req';
 let sx=p.x,sz=p.z,pn='idle',dur=3,face=null;
 switch(a.type){
  case'wave':pn='wave';break;
  case'hug':case'kiss':{const off=a.type==='hug'?.6:.45;sx=req?a.cx+a.dx*off:a.cx;sz=req?a.cz+a.dz*off:a.cz;pn='hug';dur=a.type==='hug'?5:4;break}
  case'hand':{const dz=a.cz>-18?-1:1,w=Math.max(0,T-.8)*1.3*dz;sx=req?a.cx-.7:a.cx;sz=a.cz+w;dur=5;if(T>=.8){pn='hand';face=dz<0?Math.PI:0}break}
  case'dance':{const ang=T*1.6+(req?0:Math.PI),cx=Math.max(-4.4,Math.min(4.4,a.cx)),cz=Math.max(-27,Math.min(6,a.cz));sx=cx+Math.cos(ang)*.5;sz=cz+Math.sin(ang)*.5;pn='dance';dur=8;break}
  case'propose':{sx=req?a.cx+a.dx*.95:a.cx;sz=req?a.cz+a.dz*.95:a.cz;pn=T>.8?(req?'kneel':'cover'):'idle';dur=1e9;break}}
 const k=Math.min(1,dt*6);p.x+=(clampX(sx)-p.x)*k;p.z+=(clampZ(sz)-p.z)*k;
 if(face!==null)c.rotation.y=face;else if(pr)c.rotation.y=Math.atan2(pr.x-p.x,pr.z-p.z);
 curPose=pn;curMv=pn==='hand'?.6:0;
 a.hb-=dt;if(a.hb<=0){a.hb=.4;const m=new THREE.Vector3(pr?(p.x+pr.x)/2:p.x,2.3,pr?(p.z+pr.z)/2:p.z);
  if(a.type==='propose')fall(p,2);else if(a.type!=='wave')burst(m,a.type==='kiss'?3:1)}
 if(a.type==='propose'&&!req&&!a.said&&T>2.5&&$('msg').style.display!=='flex')$('msg').style.display='flex';
 if(a.type==='propose'?(a.said&&T>a.end):T>dur)endAct()}

// ---------- loop ----------
const clock=new THREE.Clock(),promptEl=$('prompt'),tmp=new THREE.Vector3();let vidStarted=false;
(function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
 const c=mine(),p=c.position;
 if(myReq&&performance.now()-myReq.t0>20000){myReq=null;if(room)room.presence({req:null}).catch(()=>{});say('No answer yet',2000)}
 if(act)actStep(dt);else{
  let ix=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+joy.x,iz=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0)+joy.y;
  const m=Math.hypot(ix,iz);let speed=0;
  if(started&&viewer.style.display!=='flex'&&$('req').style.display!=='flex'&&m>.1){if(m>1){ix/=m;iz/=m}speed=Math.min(1,m);
   const s=Math.sin(yaw),co=Math.cos(yaw),wx=ix*co+iz*s,wz=-ix*s+iz*co;
   let nx=Math.max(-5.2,Math.min(5.2,p.x+wx*4*dt)),nz=Math.max(-28.5,Math.min(7,p.z+wz*4*dt));
   if(partner&&Math.hypot(nx-theirs().position.x,nz-theirs().position.z)<.7){nx=p.x;nz=p.z}
   p.x=nx;p.z=nz;facing=Math.atan2(wx,wz)}
  let d=facing-c.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));c.rotation.y+=d*Math.min(1,dt*10);
  curMv=speed;curPose=speed>.05?'walk':'idle'}
 pose(c,curPose,curMv,t,partner?theirs().position:null);
 if(partner){const pr=partner.presence,tg=theirs();if(typeof pr.x==='number'){const k=1-Math.exp(-dt*12);
  if(!tg.userData.init){tg.position.set(pr.x,0,pr.z);tg.rotation.y=pr.ry||0;tg.userData.init=true}
  tg.position.x+=(pr.x-tg.position.x)*k;tg.position.z+=(pr.z-tg.position.z)*k;let d=(pr.ry||0)-tg.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));tg.rotation.y+=d*k;
  pose(tg,pr.pose||'idle',pr.mv||0,t,p)}}
 sendPresence(false);tickHearts(dt);
 // cinema: starts when you walk close, follower keeps in step with leader, music ducks under the film
 if(started&&!vidStarted&&p.z<-14){vidStarted=true;vid.play().catch(()=>say('Tap the screen to play the video',3500))}
 const playing=isPlaying();
 if(playing&&partner&&myPeer&&myPeer>partner.peer){const vt=partner.presence.vt;if(typeof vt==='number'&&Math.abs(vid.currentTime-vt)>2.5&&vid.readyState>=2)vid.currentTime=vt+.3}
 const tv=playing?vol*.15:vol;if(Math.abs(song.volume-tv)>.01)song.volume=tv;
 const dist=Math.sin(yaw),cd=5.2;cam.position.set(p.x+Math.sin(yaw)*Math.cos(pitch)*cd,1.9+Math.sin(pitch)*cd,p.z+Math.cos(yaw)*Math.cos(pitch)*cd);
 cam.position.x=Math.max(-5.7,Math.min(5.7,cam.position.x));cam.position.z=Math.min(7.7,Math.max(-29.7,cam.position.z));cam.lookAt(p.x,1.6,p.z);
 let near=null;for(const f of frames){f.getWorldPosition(tmp);if(Math.hypot(tmp.x-p.x,tmp.z-p.z)<3.2)near=f}
 if(near&&!act){promptEl.style.display='block';promptEl.textContent='Tap or click the frame: '+near.userData.title}else promptEl.style.display='none';
 renderer.render(scene,cam)})();

// connect
(async()=>{updateStatus();
 try{if(!(window.claude&&claude.use))throw 0;room=await claude.use('room');const user=await claude.use('user');
  if(room){let owner=false;try{owner=user?await user.isOwner():false}catch(e){}
   setRole(owner?'sharvin':'sarvinah');room.onPeers(onPeers,()=>{room=null;partner=null;updateStatus()});room.presence({role:me}).catch(()=>{})}}
 catch(e){room=null}
 updateStatus()})();
})();
</script>
